<!-- 9. Форма заявки -->
<section class="apply" id="apply">
  <div class="container">
    <div class="apply-grid">
      <div class="apply-side">
        <span class="section-tag">Заявка</span>
        <h2 id="slots-title">Заполните анкету — забронируем за вами место</h2>
        <p>Ответим за 15 минут и зафиксируем место в группе. Вся программа семинара уже на сайте — в разделе «Программа».</p>
      </div>

      <form class="apply-form" id="apply-form" data-bitrix-webhook="" novalidate>
        <div class="form-field">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" placeholder="Как к вам обращаться" required />
        </div>
        <div class="form-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="you@mail.ru" />
        </div>
        <div class="form-field">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required />
        </div>
        <div class="form-field">
          <label for="city">Город</label>
          <input type="text" id="city" name="city" placeholder="Москва" />
        </div>

        <label class="form-consent">
          <input type="checkbox" id="consent" name="consent" required />
          <span>Нажимая кнопку, я даю согласие на обработку персональных данных в соответствии с <a href="#">Согласием</a> и <a href="#">Политикой конфиденциальности</a> (ФЗ №152-ФЗ).</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Отправить заявку</button>
        <p class="form-note">Отвечаем за 15 минут и бронируем место в группе</p>
        <div class="form-success" id="form-success">Спасибо! Заявка принята — мы свяжемся с вами в течение 15 минут.</div>
      </form>
    </div>
  </div>
</section>
