<!-- Тарифы (кратко, главная) -->
<section class="pricing" id="pricing">
  <div class="container">
    <div class="section-head">
      <span class="section-tag">Тарифы</span>
      <h2>Открытый прайс — без «уточните у менеджера»</h2>
    </div>

    <div class="pricing-card">
      <div class="price-options">
        <div class="price-option">
          <span class="price-option-tag">Офлайн, Москва</span>
          <div class="price-amount">5 000 ₽</div>

        <div class="countdown-unit">
          <span class="countdown-num" id="cd-hours">00</span>
          <span class="countdown-label">часов</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-num" id="cd-mins">00</span>
          <span class="countdown-label">минут</span>

        <div class="countdown-unit">

          <span class="countdown-label">секунд</span>
        </div>
      </div>
    </div>
  </div>
